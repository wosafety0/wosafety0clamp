name: Tests

on:
  push:
    branches:
      - main
      - dev/kcv-research-python-direction
      - dev/expedition-mvp-cdp-first-20261023
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run standard-library unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
