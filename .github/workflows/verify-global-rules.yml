name: Verify Global Rules Access

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-global-rules:
    name: Verify canonical global rules access
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Create read-only installation token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.AGENTS_APP_ID }}
          private-key: ${{ secrets.AGENTS_APP_PRIVATE_KEY }}
          owner: wosafety0
          repositories: Agents-global

      - name: Read current canonical rules from main
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="wosafety0/Agents-global"
          rules_ref="main"

          rules_commit="$(gh api "repos/${repo}/git/ref/heads/${rules_ref}" --jq '.object.sha')"
          actual_blob_sha="$(gh api "repos/${repo}/contents/AGENTS.md?ref=${rules_ref}" --jq '.sha')"

          if [[ -z "${rules_commit}" || -z "${actual_blob_sha}" ]]; then
            echo "::error::Canonical AGENTS.md ref or blob SHA could not be resolved."
            exit 1
          fi

          echo "PASS: canonical AGENTS.md is readable from ${repo}@${rules_ref}."
          echo "Canonical commit: ${rules_commit}"
          echo "AGENTS.md blob SHA: ${actual_blob_sha}"
