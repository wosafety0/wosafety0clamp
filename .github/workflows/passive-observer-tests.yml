name: Passive observer offline tests
on:
  push:
    branches:
      - dev/expedition-closed-loop-mvp
    paths:
      - 'src/kancollebot/adapters/poi/cdp_websocket.py'
      - 'src/kancollebot/adapters/poi/cdp_network_events.py'
      - 'src/kancollebot/adapters/poi/cdp_passive_observer.py'
      - 'tools/observe_poi_network.py'
      - 'tests/test_observe_poi_network.py'
      - 'tests/test_cdp_websocket.py'
      - 'tests/test_cdp_passive_observer.py'
      - 'tools/visual_diff_probe.py'
      - 'tests/test_visual_diff_probe.py'
      - '.github/workflows/passive-observer-tests.yml'
      - 'pyproject.toml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install package and vision test dependencies
        run: python -m pip install -e '.[vision]'
      - name: Compile changed Python modules
        run: python -m compileall -q src/kancollebot/adapters/poi/cdp_websocket.py src/kancollebot/adapters/poi/cdp_network_events.py src/kancollebot/adapters/poi/cdp_passive_observer.py tools/observe_poi_network.py tools/visual_diff_probe.py tests/test_cdp_websocket.py tests/test_cdp_passive_observer.py tests/test_observe_poi_network.py tests/test_visual_diff_probe.py
      - name: Test CDP passive event transport
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_cdp_websocket.py' -v
      - name: Test passive observer facade
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_cdp_passive_observer.py' -v
      - name: Test observer output projection
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_observe_poi_network.py' -v
      - name: Test offline visual difference probe
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_visual_diff_probe.py' -v
