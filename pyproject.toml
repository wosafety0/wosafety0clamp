[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kancollebot"
version = "0.1.0"
description = "A safety-first local KanColle automation framework"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
kancollebot = "kancollebot.cli:main"

[project.optional-dependencies]
vision = ["opencv-python-headless>=4.10", "numpy>=2.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# Static reference/fingerprint data is loaded from Path(__file__) at import
# time; it must be present in an installed wheel as well as a source checkout.
[tool.setuptools.package-data]
"kancollebot.adapters.poi" = ["*.json"]
"kancollebot.calibration" = ["data/*.json"]
"kancollebot.expeditions" = ["data/*.json"]
