[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kancollebot"
version = "0.1.0"
description = "A safety-first local KanColle automation framework"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
vision = ["opencv-python-headless>=4.10", "numpy>=2.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
